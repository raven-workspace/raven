[[set]]
identifier = "terminal-commands"
description = "The terminal's commands: spawn, write, resize and close, and list and attach for a reloaded webview."
permissions = [
  "allow-terminal-spawn",
  "allow-terminal-list",
  "allow-terminal-attach",
  "allow-terminal-write",
  "allow-terminal-resize",
  "allow-terminal-close",
]
