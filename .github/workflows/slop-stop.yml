# Blocks AI attribution in commit messages and AI tool files in commits, with the same hooks as .githooks
# (installed locally by `npm install`). This is the check that can't be skipped.
name: slop-stop

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  slop-stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no "before": check just the pushed commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse "$HEAD_SHA^")
          fi
          scripts/slop-stop-ci.sh "$BASE" "$HEAD_SHA"
