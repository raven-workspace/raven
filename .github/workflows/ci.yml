# Builds and tests Raven on every pull request: the five checks from CONTRIBUTING's "Before you
# open a PR" (typecheck, lint, npm test, cargo test and a Tauri app build), plus the licence check.
# Pushes to develop and manual runs also package the Linux .deb files. All jobs run at once.
#
# - The frontend checks run once, on Linux amd64. Vitest runs in Node and jsdom, and nothing in
#   src/ depends on the OS or the CPU, so other targets would repeat the same run. npm test is
#   split into shards to keep the wait short.
# - The Rust checks run on each platform Raven ships for (docs/specs/terminal.md §3): macOS arm64,
#   Linux amd64 and Linux arm64. The Tauri build also runs the frontend build there, so a Vite,
#   Sass or esbuild binary that fails on one platform still shows up. On a PR it is a debug build
#   everywhere. On a push to develop or a manual run (Actions > CI > Run workflow, from any branch),
#   Linux makes a release build instead, packaged and uploaded as the run's .deb artifacts
#   (raven-deb-amd64, raven-deb-arm64). PRs skip it: the release link (LTO, one codegen unit) takes
#   about 6 minutes on one core, and a tester installs from develop.
# - cargo test runs with the `terminal` feature, so each platform also installs Zig and builds
#   libghostty-vt, cached per Ghostty commit. The app build and the .deb leave the feature off,
#   as plain `tauri dev` does, until the terminal ships (RAV-90).
#
# - The licence check runs once, on Linux amd64: `npm run notices -- --check` regenerates
#   THIRD_PARTY_NOTICES for every shipped target and fails if a dependency's licence is missing or
#   not on the allow-list (src-tauri/about.toml), or if the committed file is out of date. The app
#   bundle on every platform ships that committed file (tauri.conf.json, bundle.resources).
#
# A failing check fails its job, and so the PR. Within a job, later checks still run, so one red
# run shows every failure at once.
#
# The Rust cache is saved only by runs on develop. A PR can restore its base branch's caches but
# not another PR's, so the push run after each merge keeps every PR's first run warm, and PRs
# don't fill the repo's 10 GB cache quota with copies of their own.
#
# A new push to a PR cancels the PR's older run. Push and manual runs each get their own group and
# always finish, so every merge to develop gets its .deb and saves its cache.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-lint:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        id: npm-ci
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run lint

  npm-test:
    name: npm test (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: npm test
        # A longer timeout than the local 5s: the .tsx tests are slow, not stuck, on a busy runner.
        run: npm test -- --shard=${{ matrix.shard }}/3 --testTimeout=15000

  rust:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # The Linux release build (LTO, one codegen unit) on develop is the long pole.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: Linux amd64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    env:
      # File and line numbers in backtraces, without full debug info: faster links, smaller cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the apt cache
        if: runner.os == 'Linux'
        id: apt-cache-key
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # The downloaded .deb files, about 65 MB. apt still updates its lists and installs as usual, so
      # a stale cache only means some packages download again. A new runner image or a change to
      # this file saves a fresh copy; restore-keys reuses the last one until then.
      - name: Restore downloaded apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.arch }}-${{ steps.apt-cache-key.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.arch }}-

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        # Tauri's WebKitGTK stack (https://v2.tauri.app/start/prerequisites/#linux). The vendored
        # SQLCipher and OpenSSL that rusqlite builds need only the compiler, perl and make the
        # runner already has.
        run: |
          # Skip rebuilding the man page index after the install: nobody reads man pages here.
          sudo rm -f /var/lib/man-db/auto-update
          # The cache is owned by the runner user, and apt's own archive by root, so copy across.
          if compgen -G ~/apt-archives/'*.deb' > /dev/null; then
            sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
          mkdir -p ~/apt-archives
          cp /var/cache/apt/archives/*.deb ~/apt-archives/
          echo "apt archive: $(ls ~/apt-archives/*.deb | wc -l) packages, $(du -sh ~/apt-archives | cut -f1)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The `terminal` Cargo feature (docs/specs/terminal.md §4-5) links libghostty-vt, which Zig
      # builds from Ghostty's source. Each target builds it once per Ghostty commit and Zig version,
      # caches the installed library, and cargo links that copy through libghostty-rs's pkg-config
      # feature instead of building it again in a build script.
      # Zig itself, about 50 MB, cached by version and target and saved from any run, like the
      # library below: mirrors are sometimes slow enough to add minutes to a run.
      - name: Restore Zig
        id: zig-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zig
          key: zig-0.17.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        env:
          ZIG_VERSION: 0.17.1
        # The official tarball, checked against ziglang.org's published SHA-256. ziglang.org asks
        # CI to download from its community mirrors; it is the last resort here.
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) target=aarch64-macos sha=75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d ;;
            Linux-X64)   target=x86_64-linux  sha=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a ;;
            Linux-ARM64) target=aarch64-linux sha=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795 ;;
            *) echo "no Zig for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          file="zig-$target-$ZIG_VERSION.tar.xz"
          for mirror in https://pkg.hexops.org/zig https://zigmirror.com https://zig.linus.dev/zig \
                        https://ziglang.freetls.fastly.net https://ziglang.org/download/$ZIG_VERSION; do
            # A slow mirror gives way to the next after two minutes.
            if curl -fsSL --max-time 120 -o "$RUNNER_TEMP/$file" "$mirror/$file?source=github-actions" &&
               echo "$sha  $RUNNER_TEMP/$file" | shasum -a 256 -c -; then
              echo "Zig from $mirror"
              break
            fi
            rm -f "$RUNNER_TEMP/$file"
          done
          test -f "$RUNNER_TEMP/$file"
          mkdir -p ~/zig
          tar -xJf "$RUNNER_TEMP/$file" -C ~/zig --strip-components=1

      - name: Save Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zig
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Put Zig on PATH
        run: |
          echo "$HOME/zig" >> "$GITHUB_PATH"
          echo "ZIG_VERSION=$("$HOME/zig/zig" version)" >> "$GITHUB_ENV"

      - name: Find the pinned Ghostty commit
        id: ghostty
        working-directory: src-tauri
        # libghostty-vt-sys pins the Ghostty source in its build.rs. Reading it from there keeps the
        # cache key and the bindings on the same commit when the libghostty-rs pin moves.
        run: |
          sys=$(cargo metadata --locked --format-version 1 --features terminal |
            jq -r '.packages[] | select(.name == "libghostty-vt-sys") | .manifest_path')
          commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' "$(dirname "$sys")/build.rs")
          test -n "$commit"
          echo "Ghostty $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Saved from any run, PRs included: the key names an exact commit, Zig version and target, so
      # every copy is identical, and it is a few MB. A PR's first run warms its own reruns; the push
      # run after the merge warms every later PR.
      - name: Restore libghostty-vt
        id: libghostty-vt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/libghostty-vt
          key: libghostty-vt-${{ steps.ghostty.outputs.commit }}-zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ReleaseFast

      - name: Build libghostty-vt
        if: steps.libghostty-vt-cache.outputs.cache-hit != 'true'
        env:
          GHOSTTY_COMMIT: ${{ steps.ghostty.outputs.commit }}
        # The same zig build libghostty-vt-sys's build.rs runs, as a release build for every
        # profile, with Zig's portable baseline CPU so the .deb runs on older machines.
        run: |
          start=$SECONDS
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ghostty-org/ghostty.git "$RUNNER_TEMP/ghostty"
          git -C "$RUNNER_TEMP/ghostty" checkout --quiet "$GHOSTTY_COMMIT"
          cd "$RUNNER_TEMP/ghostty"
          zig build -Demit-lib-vt=true -Doptimize=ReleaseFast -Dcpu=baseline \
            -Demit-xcframework=false -Dapp-runtime=none --prefix "$HOME/libghostty-vt"
          echo "libghostty-vt built in $((SECONDS - start))s"
          ls -l "$HOME/libghostty-vt/lib"

      - name: Save libghostty-vt
        if: steps.libghostty-vt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/libghostty-vt
          key: ${{ steps.libghostty-vt-cache.outputs.cache-primary-key }}

      - name: Point cargo at libghostty-vt
        # Fails here, not with a silent source build inside cargo, if the cached copy is unusable.
        run: |
          command -v pkg-config > /dev/null || brew install pkgconf
          echo "PKG_CONFIG_PATH=$HOME/libghostty-vt/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$HOME/libghostty-vt/lib/pkgconfig" \
            pkg-config --print-errors --static --libs libghostty-vt-static

      - name: Install npm dependencies
        id: npm-ci
        # The Tauri CLI and the frontend build that the app build embeds.
        run: npm ci

      - name: Match the Tauri build's macOS deployment target
        if: runner.os == 'macOS'
        # tauri build sets MACOSX_DEPLOYMENT_TARGET to bundle.macOS.minimumSystemVersion (Tauri's
        # default, 10.13, while tauri.conf.json leaves it unset). Crates whose build scripts read it,
        # such as the cc-built ones, otherwise build twice, once for cargo test and once for the app,
        # and come out of the cache stale every run. Change both together.
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"

      - name: cargo test
        working-directory: src-tauri
        # With the terminal, so its PTY and libghostty-vt tests run on every target. The app build
        # below leaves it off, as plain `tauri dev` does, so the default build is checked too.
        run: cargo test --locked --features terminal,libghostty-vt/pkg-config

      - name: Build the Tauri app
        if: >-
          ${{ !cancelled() && steps.npm-ci.outcome == 'success' &&
              (runner.os == 'macOS' || github.event_name == 'pull_request') }}
        # A debug build with the frontend embedded, as a release build would have it, reusing the
        # dependencies cargo test just compiled. On Linux, only on PRs: the .deb step replaces it.
        run: npx tauri build --debug --no-bundle -- --locked

      - name: Build the .deb
        id: deb
        if: >-
          ${{ !cancelled() && steps.npm-ci.outcome == 'success' &&
              runner.os == 'Linux' && github.event_name != 'pull_request' }}
        # A release build, packaged as the .deb a tester installs: release so it opens the release
        # vault (raven/, not raven-dev/). tauri.linux.conf.json bundles only the .deb.
        run: npx tauri build -- --locked

      - name: Upload the .deb
        if: ${{ !cancelled() && steps.deb.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raven-deb-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  licences:
    name: Licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        # The licence files are read from the installed packages.
        run: npm ci

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # The prebuilt release, checked against the SHA-256 in install-action's manifest. The version
      # must match CARGO_ABOUT_VERSION in scripts/third-party-notices.mjs.
      - name: Install cargo-about
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-about@0.9.3

      - name: Check THIRD_PARTY_NOTICES
        # Fails when a dependency's licence is missing or not on the allow-list in
        # src-tauri/about.toml, and when the committed file doesn't match the lockfiles.
        run: npm run notices -- --check
